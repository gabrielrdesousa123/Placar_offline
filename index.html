<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Placar Bocha Offline — SCBP</title>
<style>
/* ── RESET & BASE (cópia fiel do live-scoresheet) ─────────────────── */
html, body { overflow: hidden !important; height: 100vh; width: 100vw; margin: 0; padding: 0; background: #000; font-family: sans-serif; }
body::-webkit-scrollbar { display: none; }
* { box-sizing: border-box; }

/* ── SETUP SCREEN ─────────────────────────────────────────────────── */
#setup-screen { position: fixed; inset: 0; z-index: 9000; background: #0f172a; display: flex; align-items: center; justify-content: center; }
.setup-card { background: #1e293b; border-radius: 16px; padding: 32px; width: 100%; max-width: 580px; border: 2px solid #334155; }
.setup-card h1 { text-align: center; font-size: 26px; color: #fff; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 1px; }
.setup-card p { text-align: center; color: #94a3b8; margin-bottom: 24px; font-size: 14px; }
.class-section label { display: block; font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; color: #fbbf24; margin-bottom: 8px; }
.class-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-bottom: 16px; }
.class-btn { padding: 10px 6px; border: 2px solid #334155; border-radius: 8px; background: #0f172a; color: white; font-size: 12px; font-weight: 700; cursor: pointer; text-align: center; transition: all 0.2s; }
.class-btn:hover { border-color: #fbbf24; }
.class-btn.selected { border-color: #fbbf24; background: rgba(251,191,36,0.15); color: #fbbf24; }
.class-btn small { display: block; font-size: 9px; color: #94a3b8; font-weight: 400; margin-top: 2px; }
.class-btn.selected small { color: #fbbf24; }
.custom-section { display: none; background: #0f172a; border-radius: 12px; padding: 16px; margin-bottom: 16px; border: 1px solid #334155; }
.custom-section.visible { display: block; }
.custom-row { display: flex; gap: 12px; margin-bottom: 10px; align-items: center; }
.custom-row label { font-size: 12px; color: #94a3b8; flex: 1; }
.custom-row input { width: 80px; padding: 8px; border-radius: 6px; border: 1px solid #334155; background: #1e293b; color: white; font-size: 14px; text-align: center; }
.player-setup { display: flex; gap: 16px; margin-bottom: 20px; }
.player-input { flex: 1; display: flex; flex-direction: column; gap: 8px; }
.player-input label { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; }
.player-input.red label { color: #dc2626; }
.player-input.blue label { color: #2563eb; }
.player-input input { padding: 12px; border-radius: 8px; border: 2px solid #334155; background: #0f172a; color: white; font-size: 15px; outline: none; transition: border-color 0.2s; }
.player-input.red input:focus { border-color: #dc2626; }
.player-input.blue input:focus { border-color: #2563eb; }
.btn-start { width: 100%; padding: 16px; border: none; border-radius: 12px; background: #fbbf24; color: #0f172a; font-size: 18px; font-weight: 900; cursor: pointer; text-transform: uppercase; letter-spacing: 1px; transition: transform 0.1s; }
.btn-start:active { transform: scale(0.98); }

/* ── LIVE CONTAINER (cópia fiel) ──────────────────────────────────── */
.live-container { margin: 0; padding: 0; background: #000; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
.live-header { display: flex; justify-content: space-between; align-items: center; background: #0f172a; padding: 0 25px; border-bottom: 2px solid #334155; color: white; height: 60px; flex-shrink: 0; }
.header-end-title { text-align: center; font-size: 20px; font-weight: 900; color: #fbbf24; text-transform: uppercase; letter-spacing: 2px; }
.header-match-info { text-align: right; font-size: 14px; font-weight: bold; color: #94a3b8; }
.btn-hamburger { background: transparent; border: none; color: white; font-size: 24px; cursor: pointer; padding: 10px; transition: 0.2s; }
.btn-hamburger:hover { color: #3b82f6; }

/* ── PANELS (cópia fiel) ──────────────────────────────────────────── */
.panels-grid { display: flex; position: relative; flex: 1; overflow: hidden; }
.panel { flex: 1; display: flex; flex-direction: column; color: white; position: relative; transition: background-color 0.3s ease; overflow: hidden; }
.panel-red { background: #dc2626; border-right: 2px solid #000; }
.panel-blue { background: #2563eb; border-left: 2px solid #000; }

/* ── PLAYER HEAD (cópia fiel) ─────────────────────────────────────── */
.p-head { padding: 10px 15px; text-align: center; text-transform: uppercase; line-height: 1.1; background: rgba(0,0,0,0.2); position: relative; min-height: 95px; display: flex; flex-direction: column; justify-content: center; align-items: center; flex-shrink: 0; }
#p1-name-display, #p2-name-display { font-weight: 900; color: #fff; margin-top: 5px; width: 100%; word-break: break-word; white-space: normal; line-height: 1.1; text-shadow: 0 2px 4px rgba(0,0,0,0.5); position: relative; z-index: 2; padding: 0 1vw; text-transform: uppercase; font-size: clamp(18px, 3vw, 32px); }
.p-club-name { font-size: 18px; font-weight: 800; color: rgba(255,255,255,0.9); margin-top: 4px; letter-spacing: 1px; z-index: 2; position: relative; text-shadow: 0 1px 3px rgba(0,0,0,0.5); width: 100%; word-break: break-word; white-space: normal; line-height: 1.1; text-transform: uppercase; }

/* ── BODY / SCORE / TIMER (cópia fiel) ────────────────────────────── */
.p-body { padding: 12px 16px; display: flex; flex-direction: column; align-items: center; justify-content: center; flex: 1; overflow-y: hidden; position: relative; gap: 2.5vh; }
.score-area { width: 100%; display: flex; flex-direction: column; align-items: center; position: relative; padding-bottom: 1vh; margin-top: 10px; }
.score-label { font-weight: bold; color: rgba(255,255,255,0.8); font-size: 13px; text-transform: uppercase; margin-bottom: 4px; letter-spacing: 1px; }
.score-val { font-size: clamp(80px, 15vw, 150px); font-weight: bold; user-select: none; background: rgba(0,0,0,0.4); border-radius: 20px; padding: 0 40px; border: 2px solid rgba(255,255,255,0.2); text-shadow: 0 4px 10px rgba(0,0,0,0.4); box-shadow: inset 0 4px 10px rgba(0,0,0,0.2); line-height: 1; margin: 0; color: #fff; }
.timer-row { display: flex; align-items: center; justify-content: center; position: relative; width: 100%; max-width: 440px; background: #000; padding: 0.8vh 2vw; border-radius: 2vh; border: 2px solid rgba(255,255,255,0.2); box-shadow: 0 4px 10px rgba(0,0,0,0.5); gap: 2vw; }
.score-timer-block { width: 100%; display: flex; flex-direction: column; align-items: center; gap: 2.5vh; border-bottom: 2px dashed rgba(255,255,255,0.25); padding-bottom: 2vh; margin-bottom: 0.5vh; }
.time-display { font-size: clamp(50px, 10vw, 110px); font-weight: bold; font-variant-numeric: tabular-nums; line-height: 1; color: white; cursor: pointer; transition: 0.2s; text-shadow: 0 4px 10px rgba(0,0,0,0.3); }
.btn-play-icon { font-size: 60px; background: transparent; border: none; color: rgba(255,255,255,0.8); cursor: pointer; transition: 0.2s; outline: none; display: flex; align-items: center; justify-content: center; padding: 0; }
.btn-play-icon:hover:not(:disabled) { color: white; transform: scale(1.1); filter: drop-shadow(0 0 15px rgba(255,255,255,0.5)); }
.btn-play-icon:disabled { opacity: 0.3; cursor: not-allowed; }

/* ── BALLS (cópia fiel) ───────────────────────────────────────────── */
.balls-wrapper { display: flex; align-items: center; gap: 18px; margin-top: 0; background: rgba(0,0,0,0.25); padding: 10px 24px; border-radius: 30px; border: 1px solid rgba(255,255,255,0.1); width: 100%; max-width: 430px; justify-content: space-between; }
.btn-ball-ctrl { background: rgba(255,255,255,0.2); border: none; color: white; font-size: 30px; font-weight: bold; width: 50px; height: 50px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 0; transition: 0.2s; }
.btn-ball-ctrl:hover { background: rgba(255,255,255,0.4); transform: scale(1.1); }
.balls-container { display: flex; gap: 8px; flex: 1; justify-content: center; min-height: 33px; }
.boccia-ball { width: 33px; height: 33px; border-radius: 50%; box-shadow: inset -3px -3px 6px rgba(0,0,0,0.5), 0 2px 4px rgba(0,0,0,0.4); cursor: pointer; }
.red-ball { background: #fca5a5; }
.blue-ball { background: #93c5fd; }
.boccia-ball.played { opacity: 0.2; filter: grayscale(70%); box-shadow: none; transform: scale(0.85); }

/* ── VIOLATIONS (cópia fiel) ──────────────────────────────────────── */
.btn-viol { background: rgba(0,0,0,0.5); color: #fbbf24; border: 1px dashed rgba(255,255,255,0.4); padding: 13px; border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 0; width: 100%; max-width: 430px; text-transform: uppercase; font-size: 16px; transition: 0.2s; }
.btn-viol:hover { background: rgba(0,0,0,0.8); border-style: solid; }
.viol-list-main { display: flex; flex-direction: column; gap: 5px; margin-top: 5px; width: 100%; max-width: 80%; align-self: center; height: 100px; overflow-y: auto; padding-right: 5px; }
#main-p1-viol-list { align-self: flex-start; margin-left: 20px; }
#main-p2-viol-list { align-self: flex-end; margin-right: 20px; }
.viol-list-main::-webkit-scrollbar { width: 6px; }
.viol-list-main::-webkit-scrollbar-track { background: rgba(0,0,0,0.2); border-radius: 4px; }
.viol-list-main::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.4); border-radius: 4px; }
.viol-item { background: rgba(0,0,0,0.6); border: 1px solid rgba(251,191,36,0.4); padding: 13px 16px; border-radius: 6px; font-size: 16px; display: flex; justify-content: space-between; align-items: center; width: 100%; color: #fbbf24; font-weight: bold; text-align: left; }
.viol-item span { white-space: normal; word-wrap: break-word; flex: 1; line-height: 1.3; }
.main-del-viol { background: transparent; border: none; color: #fca5a5; font-weight: bold; cursor: pointer; font-size: 20px; margin-left: 10px; padding: 0; line-height: 1; transition: 0.2s; }
.main-del-viol:hover { color: #ef4444; transform: scale(1.2); }

/* ── CENTER OVERLAY (cópia fiel) ──────────────────────────────────── */
.center-overlay { position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%); z-index: 50; display: flex; flex-direction: column; align-items: center; justify-content: center; pointer-events: none; width: auto; }
.box-stopped { display: flex; flex-direction: column; gap: 8px; background: rgba(15, 23, 42, 0.95); padding: 10px 14px; border-radius: 12px; box-shadow: 0 6px 25px rgba(0,0,0,0.8); border: 2px solid #334155; backdrop-filter: blur(5px); pointer-events: auto; max-width: 200px; }
.btn-center { background: #334155; color: white; border: 2px solid #475569; padding: 8px 14px; border-radius: 6px; font-size: 13px; font-weight: bold; cursor: pointer; transition: 0.2s; box-shadow: 0 3px 5px rgba(0,0,0,0.3); text-transform: uppercase; letter-spacing: 0.5px; }
.btn-center:hover:not(:disabled) { background: #475569; border-color: #94a3b8; transform: translateY(-2px); }
.btn-center:disabled { opacity: 0.3; cursor: not-allowed; box-shadow: none; }
.btn-center-highlight { border-color: #fbbf24; color: #fef08a; background: #854d0e; }

/* ── TB SCORE (cópia fiel) ────────────────────────────────────────── */
.tb-score-display { position: absolute; left: -50px; font-size: 30px; color: #fbbf24; font-weight: bold; display: none; }

/* ── PENALTY CHIP (cópia fiel) ────────────────────────────────────── */
.penalty-ball-container { position: absolute; right: -80px; top: 50%; transform: translateY(-50%); display: flex; flex-direction: column; gap: 8px; z-index: 10; }
.chip-1p { background: #eab308; color: #1e293b; border: 3px solid #fef08a; border-radius: 24px; min-width: 58px; height: 44px; padding: 0 12px; font-size: 17px; font-weight: 900; cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.5); transition: 0.2s; white-space: nowrap; }
.chip-1p.pend:hover { transform: scale(1.1); background: #fef08a; }
.chip-1p.done { background: #22c55e; border-color: #bbf7d0; color: #052e16; opacity: 0.85; cursor: default; }

/* ── SIDEBAR (cópia fiel) ─────────────────────────────────────────── */
.sidebar { position: fixed; top: 0; left: -320px; width: 300px; height: 100%; background: #0f172a; border-right: 2px solid #334155; z-index: 9999; display: flex; flex-direction: column; transition: left 0.3s ease; box-shadow: 10px 0 30px rgba(0,0,0,0.8); }
.sidebar.open { left: 0; }
.sidebar-header { padding: 20px; font-size: 20px; font-weight: bold; color: white; border-bottom: 1px solid #334155; text-align: center; background: #020617; }
.sidebar-btn { background: transparent; color: white; border: none; padding: 20px; text-align: left; font-size: 16px; font-weight: bold; cursor: pointer; border-bottom: 1px solid #1e293b; transition: 0.2s; }
.sidebar-btn:hover { background: #1e293b; color: #3b82f6; padding-left: 25px; }
.sidebar-btn.close-btn { background: #7f1d1d; text-align: center; border: none; margin-top: auto; }
.sidebar-btn.close-btn:hover { background: #b91c1c; padding-left: 20px; }

/* ── MODALS ───────────────────────────────────────────────────────── */
.modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 9998; display: none; }
.central-modal { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: white; padding: 25px; border-radius: 12px; box-shadow: 0 10px 40px rgba(0,0,0,0.8); display: none; flex-direction: column; gap: 20px; z-index: 10000; color: black; border: 4px solid #0f172a; min-width: 400px; width: 90%; max-width: 600px; max-height: 90vh; overflow-y: auto; }
.central-modal h3 { margin: 0; font-size: 18px; text-transform: uppercase; color: #1e293b; text-align: center; border-bottom: 2px solid #e2e8f0; padding-bottom: 10px; }
.central-modal select { width: 100%; padding: 12px; border-radius: 8px; border: 2px solid #e2e8f0; font-size: 14px; }
.modal-btns { display: flex; gap: 10px; }
.modal-btns button { flex: 1; padding: 15px; font-size: 16px; font-weight: bold; border: none; border-radius: 6px; cursor: pointer; }
.btn-primary { background: #0d6efd; color: white; }
.btn-secondary { background: #e2e8f0; color: #475569; }

/* ── SUMULA PREVIEW MODAL ─────────────────────────────────────────── */
.sumula-modal { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: white; padding: 25px; border-radius: 12px; box-shadow: 0 10px 40px rgba(0,0,0,0.8); display: none; flex-direction: column; gap: 16px; z-index: 10001; color: black; border: 4px solid #0f172a; width: 95%; max-width: 800px; max-height: 95vh; overflow-y: auto; }
.sumula-modal h3 { margin: 0; font-size: 18px; text-transform: uppercase; color: #1e293b; text-align: center; border-bottom: 2px solid #e2e8f0; padding-bottom: 10px; }
.sumula-preview-area { max-height: 60vh; overflow-y: auto; border: 1px solid #e2e8f0; border-radius: 8px; padding: 10px; }
.btn-print { background: #16a34a; color: white; }
.btn-print:hover { background: #15803d; }

/* ── PRINT STYLES ─────────────────────────────────────────────────── */
@media print {
 body * { visibility: hidden; }
 #print-area, #print-area * { visibility: visible; }
 #print-area { position: absolute; left: 0; top: 0; width: 100%; background: white; color: black; padding: 20px; }
}
#print-area { display: none; }

/* ── RESPONSIVE ───────────────────────────────────────────────────── */
@media (max-width: 700px) {
 .panels-grid { flex-direction: column; }
 .panel-red { border-right: none; border-bottom: 2px solid #000; }
 .panel-blue { border-left: none; border-top: 2px solid #000; }
 .score-val { font-size: clamp(60px, 12vw, 100px); padding: 0 20px; }
 .time-display { font-size: clamp(36px, 8vw, 70px); }
 .class-grid { grid-template-columns: repeat(2, 1fr); }
 .center-overlay { bottom: 10px; }
}
</style>
</head>
<body>

<!-- ═══════════════ SETUP SCREEN ═══════════════ -->
<div id="setup-screen">
 <div class="setup-card">
 <h1>🎯 Placar Bocha</h1>
 <p>Configure a partida antes de iniciar</p>

 <div class="class-section">
 <label>Classe / Modalidade</label>
 <div class="class-grid" id="class-grid">
 <button class="class-btn" data-class="BC1" data-ends="4" data-time="360" data-balls="6">BC1<small>Individual</small></button>
 <button class="class-btn" data-class="BC2" data-ends="4" data-time="300" data-balls="6">BC2<small>Individual</small></button>
 <button class="class-btn" data-class="BC3" data-ends="4" data-time="360" data-balls="6">BC3<small>c/ RO</small></button>
 <button class="class-btn" data-class="BC4" data-ends="4" data-time="300" data-balls="6">BC4<small>Individual</small></button>
 <button class="class-btn" data-class="Pares BC3" data-ends="4" data-time="360" data-balls="3">Pares BC3<small>Dupla</small></button>
 <button class="class-btn" data-class="Pares BC4" data-ends="4" data-time="300" data-balls="3">Pares BC4<small>Dupla</small></button>
 <button class="class-btn" data-class="Equipe" data-ends="6" data-time="360" data-balls="2">Equipe<small>Trio</small></button>
 <button class="class-btn" data-class="custom" data-ends="4" data-time="300" data-balls="6">⚙️ Custom<small>Personalizar</small></button>
 </div>
 </div>

 <div class="custom-section" id="custom-section">
 <div class="custom-row"><label>Número de Ends</label><input type="number" id="custom-ends" min="1" max="10" value="4"></div>
 <div class="custom-row"><label>Tempo por Parcial (seg)</label><input type="number" id="custom-time" min="60" max="900" value="300" step="30"></div>
 <div class="custom-row"><label>Bolas por Atleta/End</label><input type="number" id="custom-balls" min="1" max="6" value="6"></div>
 </div>

 <div class="player-setup">
 <div class="player-input red">
 <label>🔴 Vermelho — Atleta</label>
 <input type="text" id="p1-name" placeholder="Nome do atleta" autocomplete="off">
 <label style="margin-top:6px;">Clube / Equipe</label>
 <input type="text" id="p1-club" placeholder="Clube ou equipe" autocomplete="off">
 </div>
 <div class="player-input blue">
 <label>🔵 Azul — Atleta</label>
 <input type="text" id="p2-name" placeholder="Nome do atleta" autocomplete="off">
 <label style="margin-top:6px;">Clube / Equipe</label>
 <input type="text" id="p2-club" placeholder="Clube ou equipe" autocomplete="off">
 </div>
 </div>
 <button class="btn-start" onclick="startGame()">▶ INICIAR PARTIDA</button>
 </div>
</div>

<!-- ═══════════════ GAME SCREEN ═══════════════ -->
<div id="game-screen" class="live-container" style="display:none;">

 <!-- HEADER -->
 <div class="live-header">
 <button class="btn-hamburger" id="btn-menu">☰</button>
 <div class="header-end-title" id="header-end">END 1</div>
 <div class="header-match-info" id="header-class">BC1</div>
 </div>

 <!-- SIDEBAR -->
 <div class="sidebar" id="sidebar">
 <div class="sidebar-header">⚙️ Menu</div>
 <button class="sidebar-btn" id="btn-sumula">📄 Ver Súmula</button>
 <button class="sidebar-btn" id="btn-fullscreen">⛶ Tela Cheia</button>
 <button class="sidebar-btn close-btn" id="btn-menu-close">✕ FECHAR</button>
 <button class="sidebar-btn" id="btn-reset" style="color:#ef4444;border-top:1px dashed #334155;margin-top:10px;">🔄 Zerar Jogo Completo</button>
 </div>

 <!-- PANELS -->
 <div class="panels-grid">

 <!-- RED PANEL -->
 <div class="panel panel-red">
 <div class="p-head">
 <div id="p1-name-display">--</div>
 <div class="p-club-name" id="p1-club-display">--</div>
 </div>
 <div class="p-body">
 <div class="score-timer-block">
 <div class="score-area">
 <div class="score-label">PONTOS</div>
 <div style="position:relative;display:flex;align-items:center;justify-content:center;">
 <div id="p1-1p-container" class="penalty-ball-container"></div>
 <div class="score-val" id="p1-end-score">0</div>
 <div id="p1-tb-score" class="tb-score-display"></div>
 </div>
 </div>
 <div class="timer-row">
 <div class="time-display" id="p1-time-disp">00:00</div>
 <button class="btn-play-icon" id="btn-play-p1" title="Play/Pause Vermelho">▶</button>
 </div>
 </div>
 <div class="balls-wrapper">
 <button class="btn-ball-ctrl" data-side="p1" data-dir="-1">−</button>
 <div class="balls-container" id="p1-balls"></div>
 <button class="btn-ball-ctrl" data-side="p1" data-dir="1">+</button>
 </div>
 <button class="btn-viol" data-side="p1">⚠️ Adicionar Violação</button>
 <div class="viol-list-main" id="main-p1-viol-list"></div>
 </div>
 </div>

 <!-- CENTER OVERLAY -->
 <div class="center-overlay">
 <div class="box-stopped" id="center-stopped">
 <button class="btn-center btn-center-highlight" id="btn-next-end">PRÓXIMO END ▶</button>
 <button class="btn-center" id="btn-finish-match" style="display:none;background:#16a34a;color:white;border-color:#15803d;">✅ ENCERRAR JOGO</button>
 </div>
 </div>

 <!-- BLUE PANEL -->
 <div class="panel panel-blue">
 <div class="p-head">
 <div id="p2-name-display">--</div>
 <div class="p-club-name" id="p2-club-display">--</div>
 </div>
 <div class="p-body">
 <div class="score-timer-block">
 <div class="score-area">
 <div class="score-label">PONTOS</div>
 <div style="position:relative;display:flex;align-items:center;justify-content:center;">
 <div id="p2-1p-container" class="penalty-ball-container" style="right:auto;left:-80px;"></div>
 <div class="score-val" id="p2-end-score">0</div>
 <div id="p2-tb-score" class="tb-score-display" style="left:-50px;right:auto;"></div>
 </div>
 </div>
 <div class="timer-row">
 <div class="time-display" id="p2-time-disp">00:00</div>
 <button class="btn-play-icon" id="btn-play-p2" title="Play/Pause Azul">▶</button>
 </div>
 </div>
 <div class="balls-wrapper">
 <button class="btn-ball-ctrl" data-side="p2" data-dir="-1">−</button>
 <div class="balls-container" id="p2-balls"></div>

<script>
// ══════════════════════════════════════════════════════════════════════
// PLACAR BOCHA OFFLINE — Réplica fiel do live-scoresheet do SCBP
// ══════════════════════════════════════════════════════════════════════

// ── VIOLATIONS DICT (cópia fiel do live-scoresheet) ──────────────────
const VIOLATION_GROUPS = [
 { group: 'Retração (Art. 16.5)', penalty: 'Retração', rules: [

 ]},
 { group: 'Penalidade + Amarelo (Art. 16.8)', penalty: 'Penalidade + Amarelo', rules: [

 { group: 'Cartão Amarelo (Art. 16.9)', penalty: 'Cartão Amarelo', rules: [

 { code: '16.9.2', text: 'Excesso de bolas levadas para a Call Room.' },
 { code: '16.9.3', text: 'Falha na checagem de bolas pré-jogo.' },
 { code: '16.9.4', text: 'Sair da quadra sem permissão do árbitro.' },
 { code: '16.9.5', text: 'Uso de equipamento não aprovado.' }
 ]},
 { group: 'Cartão Vermelho (Art. 16.11)', penalty: 'Cartão Vermelho', rules: [

 { code: '16.11.2', text: 'Conduta violenta.' },
 { code: '16.11.3', text: 'Uso de linguagem ou gestos abusivos.' }
 ]},
 { group: 'Forfeit (Art. 16.12)', penalty: 'Forfeit', rules: [
 { code: '16.12.1', text: 'Quebrar equipamento do adversário impedindo o jogo.' },
 { code: '16.12.2', text: 'Falhar na checagem de bolas pós-jogo.' },
 { code: '16.12.3', text: 'Atleta/RO abandonar a quadra sem permissão.' },
 { code: '16.12.4', text: 'Ter menos de 3 bolas aprovadas no pré-jogo.' }
 ]}
];

// ── STATE ────────────────────────────────────────────────────────────
let state = null;
let timerInterval = null;
let activeViolSide = null;
let selectedClass = null;

function defaultState() {
 return {
 p1: { name: '', club: '', score: 0, tbScore: null, seconds: 300, ballsUsed: 0, violations: [], penalties: [] },
 p2: { name: '', club: '', score: 0, tbScore: null, seconds: 300, ballsUsed: 0, violations: [], penalties: [] },
 currentEnd: 1,
 maxEnds: 4,
 ballsPerEnd: 6,
 timerPerEnd: 300,
 classCode: 'BC1',
 partials: [],
 activeTimer: null,
 startedAt: new Date().toISOString(),
 finished: false
 };
}

// ── PERSISTENCE ──────────────────────────────────────────────────────
function saveState() {
 if (!state) return;
 try { localStorage.setItem('placar_bocha_state', JSON.stringify(state)); } catch(_) {}
}
function loadState() {
 try { const r = localStorage.getItem('placar_bocha_state'); if (r) { state = JSON.parse(r); return true; } } catch(_) {}
 return false;
}

// ── CLASS SELECTION ──────────────────────────────────────────────────
document.querySelectorAll('.class-btn').forEach(btn => {
 btn.addEventListener('click', () => {
 document.querySelectorAll('.class-btn').forEach(b => b.classList.remove('selected'));
 btn.classList.add('selected');
 selectedClass = { code: btn.dataset.class, ends: +btn.dataset.ends, time: +btn.dataset.time, balls: +btn.dataset.balls };
 document.getElementById('custom-section').classList.toggle('visible', selectedClass.code === 'custom');
 });
});

// ── START GAME ───────────────────────────────────────────────────────
function startGame() {
 if (!selectedClass) { alert('Selecione uma classe/modalidade.'); return; }
 const p1n = document.getElementById('p1-name').value.trim();
 const p2n = document.getElementById('p2-name').value.trim();
 if (!p1n || !p2n) { alert('Informe o nome de ambos os atletas.'); return; }

 state = defaultState();
 state.p1.name = p1n; state.p1.club = document.getElementById('p1-club').value.trim();
 state.p2.name = p2n; state.p2.club = document.getElementById('p2-club').value.trim();

 if (selectedClass.code === 'custom') {
 state.maxEnds = +document.getElementById('custom-ends').value || 4;
 state.timerPerEnd = +document.getElementById('custom-time').value || 300;
 state.ballsPerEnd = +document.getElementById('custom-balls').value || 6;
 state.classCode = 'Custom';
 } else {
 state.maxEnds = selectedClass.ends; state.timerPerEnd = selectedClass.time;
 state.ballsPerEnd = selectedClass.balls; state.classCode = selectedClass.code;
 }
 state.p1.seconds = state.timerPerEnd; state.p2.seconds = state.timerPerEnd;

 document.getElementById('setup-screen').style.display = 'none';
 document.getElementById('game-screen').style.display = 'flex';
 document.getElementById('header-class').textContent = state.classCode;
 renderAll();
 saveState();
}

// ── TIMER (cópia fiel da lógica do live-scoresheet) ──────────────────
function toggleTimer(side) {
 if (state.activeTimer === side || side === 'stop') {
 state.activeTimer = null; clearInterval(timerInterval);
 } else {
 state.activeTimer = side; clearInterval(timerInterval);
 timerInterval = setInterval(() => {
 if (state.activeTimer === 'p1' && state.p1.seconds > 0) { state.p1.seconds--; updateCounters(); }
 else if (state.activeTimer === 'p2' && state.p2.seconds > 0) { state.p2.seconds--; updateCounters(); }
 else toggleTimer('stop');
 }, 1000);
 }
 updateCounters();
}

// ── SCORE ────────────────────────────────────────────────────────────
function adjustScore(side, delta) {
 if (!state || state.finished) return;
 const inTB = state.p1.tbScore !== null;
 if (inTB) {
 if (state[side].tbScore === null) state[side].tbScore = 0;
 state[side].tbScore = Math.max(0, state[side].tbScore + delta);
 } else {
 state[side].score = Math.max(0, state[side].score + delta);
 }
 updateCounters(); saveState();
}

// ── BALLS ────────────────────────────────────────────────────────────
function adjustBalls(side, delta) {
 if (!state || state.finished) return;
 state[side].ballsUsed = Math.max(0, Math.min(state.ballsPerEnd, state[side].ballsUsed + delta));
 updateCounters(); saveState();
}

// ── NEXT END ─────────────────────────────────────────────────────────
function nextEnd() {
 if (!state || state.finished) return;
 const inTB = state.p1.tbScore !== null;

 if (inTB) {
 state.partials.push({ s1: state.p1.tbScore, s2: state.p2.tbScore, t1: fmtTime(state.timerPerEnd - state.p1.seconds), t2: fmtTime(state.timerPerEnd - state.p2.seconds), isTB: true });
 state.finished = true; clearInterval(timerInterval); state.activeTimer = null;
 updateCounters(); saveState(); showSumulaPreview(); return;
 }

 state.partials.push({ s1: state.p1.score, s2: state.p2.score, t1: fmtTime(state.timerPerEnd - state.p1.seconds), t2: fmtTime(state.timerPerEnd - state.p2.seconds), isTB: false });

 if (state.currentEnd >= state.maxEnds) {
 if (state.p1.score === state.p2.score) {
 if (confirm(`Placar empatado em ${state.p1.score} × ${state.p2.score}.\n\nDeseja iniciar o Tiebreak?`)) {
 state.p1.tbScore = 0; state.p2.tbScore = 0;
 state.p1.seconds = state.timerPerEnd; state.p2.seconds = state.timerPerEnd;
 state.p1.ballsUsed = 0; state.p2.ballsUsed = 0;
 updateCounters(); saveState(); return;
 }
 }
 state.finished = true; clearInterval(timerInterval); state.activeTimer = null;
 updateCounters(); saveState(); showSumulaPreview(); return;
 }

 state.currentEnd++;
 state.p1.seconds = state.timerPerEnd; state.p2.seconds = state.timerPerEnd;
 state.p1.ballsUsed = 0; state.p2.ballsUsed = 0;
 state.activeTimer = null; clearInterval(timerInterval);
 updateCounters(); saveState();
}

// ── VIOLATIONS ───────────────────────────────────────────────────────
function openViolationModal(side) {
 if (!state || state.finished) return;
 activeViolSide = side;
 const label = side === 'p1' ? '🔴 ' + state.p1.name : '🔵 ' + state.p2.name;
 document.getElementById('viol-modal-title').textContent = 'Violação — ' + label;
 const sel = document.getElementById('viol-select');
 sel.innerHTML = '<option value="">Selecione a violação...</option>';
 VIOLATION_GROUPS.forEach(g => {
 const og = document.createElement('optgroup'); og.label = g.group;
 g.rules.forEach(r => { const o = document.createElement('option'); o.value = `${r.code}|${r.text}|${g.penalty}`; o.textContent = `${r.code} — ${r.text}`; og.appendChild(o); });
 sel.appendChild(og);
 });
 document.getElementById('modal-bg').style.display = 'block';
 document.getElementById('viol-modal').style.display = 'flex';
}

function closeViolationModal() {
 document.getElementById('modal-bg').style.display = 'none';
 document.getElementById('viol-modal').style.display = 'none';
 activeViolSide = null;
}

function confirmViolation() {
 const val = document.getElementById('viol-select').value;
 if (!val) { alert('Selecione uma violação.'); return; }
 const [code, text, penalty] = val.split('|');
 const timeStr = new Date().toLocaleTimeString('pt-BR', { hour:'2-digit', minute:'2-digit' });
 const violStr = `P${state.currentEnd} - ${code} - ${text} - ${penalty} | ${timeStr}`;
 state[activeViolSide].violations.push(violStr);

 if (penalty.includes('Penalidade')) {
 const opp = activeViolSide === 'p1' ? 'p2' : 'p1';
 state[opp].penalties.push(false);
 }

 closeViolationModal(); updateCounters(); saveState();
}

function deleteViolation(side, idx) {
 if (!state) return;
 state[side].violations.splice(idx, 1);
 updateCounters(); saveState();
}

// ── FORMAT TIME ──────────────────────────────────────────────────────
function fmtTime(sec) {
 const m = Math.floor(sec / 60); const s = sec % 60;
 return String(m).padStart(2,'0') + ':' + String(s).padStart(2,'0');
}

// ── RENDER (cópia fiel da estrutura do live-scoresheet) ──────────────
function updateCounters() {
 if (!state) return;

 // Names
 document.getElementById('p1-name-display').textContent = state.p1.name || '--';
 document.getElementById('p1-club-display').textContent = state.p1.club || '--';
 document.getElementById('p2-name-display').textContent = state.p2.name || '--';
 document.getElementById('p2-club-display').textContent = state.p2.club || '--';

 // Scores
 document.getElementById('p1-end-score').textContent = state.p1.score;
 document.getElementById('p2-end-score').textContent = state.p2.score;

 // TB
 const inTB = state.p1.tbScore !== null;
 const tb1 = document.getElementById('p1-tb-score');
 const tb2 = document.getElementById('p2-tb-score');
 if (inTB) { tb1.style.display = 'block'; tb1.textContent = 'TB:' + state.p1.tbScore; tb2.style.display = 'block'; tb2.textContent = 'TB:' + state.p2.tbScore; }
 else { tb1.style.display = 'none'; tb2.style.display = 'none'; }

 // Timers
 document.getElementById('p1-time-disp').textContent = fmtTime(state.p1.seconds);
 document.getElementById('p2-time-disp').textContent = fmtTime(state.p2.seconds);

 // Play buttons
 document.getElementById('btn-play-p1').textContent = state.activeTimer === 'p1' ? '⏸' : '▶';
 document.getElementById('btn-play-p2').textContent = state.activeTimer === 'p2' ? '⏸' : '▶';

 // Header
 document.getElementById('header-end').textContent = inTB ? 'TIEBREAK' : `END ${state.currentEnd}`;

 // Balls
 renderBalls('p1'); renderBalls('p2');

 // Violations
 renderViolList('p1'); renderViolList('p2');

 // Penalty chips
 renderPenaltyChips('p1'); renderPenaltyChips('p2');

 // End buttons
 const btnNext = document.getElementById('btn-next-end');
 const btnFinish = document.getElementById('btn-finish-match');
 if (state.finished) { btnNext.style.display = 'none'; btnFinish.style.display = 'block'; btnFinish.textContent = '📄 VER SÚMULA'; btnFinish.onclick = showSumulaPreview; }
 else if (inTB) { btnNext.textContent = '✅ ENCERRAR TB'; btnNext.style.display = 'block'; btnFinish.style.display = 'none'; }
 else if (state.currentEnd >= state.maxEnds) { btnNext.textContent = '✅ ENCERRAR JOGO'; btnNext.style.display = 'block'; btnFinish.style.display = 'none'; }
 else { btnNext.textContent = `PRÓXIMO END (${state.currentEnd + 1}) ▶`; btnNext.style.display = 'block'; btnFinish.style.display = 'none'; }
}

function renderBalls(side) {
 const c = document.getElementById(`${side}-balls`); c.innerHTML = '';
 const cls = side === 'p1' ? 'red-ball' : 'blue-ball';
 for (let i = 0; i < state.ballsPerEnd; i++) {
 const b = document.createElement('div');
 b.className = 'boccia-ball ' + cls + (i < state[side].ballsUsed ? ' played' : '');
 b.onclick = () => { state[side].ballsUsed = i + 1; updateCounters(); saveState(); };
 c.appendChild(b);
 }
}

function renderViolList(side) {
 const el = document.getElementById(`main-${side}-viol-list`); el.innerHTML = '';
 (state[side].violations || []).forEach((v, i) => {
 const d = document.createElement('div'); d.className = 'viol-item';
 const parts = v.split(' | ');
 d.innerHTML = `<span>⚠️ ${esc(parts[0])}</span><button class="main-del-viol" data-side="${side}" data-idx="${i}">&times;</button>`;
 el.appendChild(d);
 });
 el.querySelectorAll('.main-del-viol').forEach(btn => {
 btn.onclick = () => deleteViolation(btn.dataset.side, +btn.dataset.idx);
 });
}

function renderPenaltyChips(side) {
 const c = document.getElementById(`${side}-1p-container`); c.innerHTML = '';
 const pens = state[side].penalties || [];
 if (pens.length === 0) return;
 const pending = pens.filter(p => !p).length;
 if (pending > 0) {
 const chip = document.createElement('button'); chip.className = 'chip-1p pend';
 chip.textContent = `${pending} 1P`;
 chip.title = `${pending} bola(s) de penalidade pendente(s)`;
 chip.onclick = () => { const idx = pens.lastIndexOf(false); if (idx >= 0) { pens[idx] = true; updateCounters(); saveState(); } };
 c.appendChild(chip);
 } else {
 const chip = document.createElement('div'); chip.className = 'chip-1p done'; chip.textContent = '✓ 1P';
 c.appendChild(chip);
 }
}

function renderAll() { updateCounters(); }

// ── ESCAPE HTML ──────────────────────────────────────────────────────
function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

// ── SUMULA (template OFICIAL do SCBP — cópia fiel) ───────────────────
function buildSumulaHTML() {
 const date = new Date(state.startedAt).toLocaleDateString('pt-BR');
 const time = new Date(state.startedAt).toLocaleTimeString('pt-BR', { hour:'2-digit', minute:'2-digit' });
 const s1 = state.p1.score, s2 = state.p2.score;

 // Winner calc (cópia da lógica do sumula-template.js)
 let winnerName = '';
 if (state.finished) {
 if (state.p1.tbScore !== null && state.p1.tbScore > state.p2.tbScore) winnerName = state.p1.name + ' (Tiebreak)';
 else if (state.p2.tbScore !== null && state.p2.tbScore > state.p1.tbScore) winnerName = state.p2.name + ' (Tiebreak)';
 else if (s1 > s2) winnerName = state.p1.name;
 else if (s2 > s1) winnerName = state.p2.name;
 else winnerName = 'Empate';
 }

 // Violations lines (cópia fiel do _violationsLines)
 function violsLines(viols) {
 let nPen = 0; const out = [];
 (viols || []).forEach(v => {
 if (/penaliza/i.test(v)) nPen++;
 else out.push('• ' + esc(v.split(' | ')[0]));
 });
 if (nPen > 0) out.push(`<b>${nPen} × 1 Bola de Penalização</b> <span style="color:#64748b;">(1P)</span>`);
 return out.length ? out.join('<br>') : 'Nenhuma violação registrada.';
 }

 // Partials rows (cópia fiel do loop do sumula-template.js)
 let partialsRows = '';
 let tbRendered = 0;
 const total = Math.max(state.maxEnds + 2, state.partials.length);
 for (let i = 0; i < total; i++) {
 const p = state.partials[i];
 const isTB = i >= state.maxEnds;
 if (isTB && !p) continue;
 const label = isTB ? (tbRendered === 0 ? 'TB 1' : 'TB 2') : `P${i+1}`;
 if (isTB) tbRendered++;
 const ps1 = p ? p.s1 : '-'; const ps2 = p ? p.s2 : '-';
 const pt1 = p ? (p.t1 || '') : ''; const pt2 = p ? (p.t2 || '') : '';
 partialsRows += `<tr>
 <td style="border:1px solid #000;padding:10px;font-size:18px;font-weight:bold;color:#000;">${esc(pt1)}</td>
 <td style="border:1px solid #000;padding:10px;font-weight:bold;font-size:24px;color:#dc2626;">${ps1}</td>
 <td style="border:1px solid #000;padding:10px;font-weight:bold;font-size:18px;background:#f8fafc;color:#000;">${label}</td>
 <td style="border:1px solid #000;padding:10px;font-weight:bold;font-size:24px;color:#2563eb;">${ps2}</td>
 <td style="border:1px solid #000;padding:10px;font-size:18px;font-weight:bold;color:#000;">${esc(pt2)}</td>
 </tr>`;
 }

 const winnerHtml = (state.finished && winnerName && winnerName !== 'Empate')
 ? `<div style="margin-top:18px;text-align:center;text-transform:uppercase;font-weight:bold;font-size:20px;color:#000;border:3px solid #000;border-radius:8px;padding:14px;background:#f1f5f9;letter-spacing:0.5px;">VENCEDOR: ${esc(winnerName)}${state.p1.club || state.p2.club ? '' : ''}</div>`
 : '';

 return `<div style="font-family:sans-serif;background:white;border-radius:8px;color:#000;padding:20px;">
 <h4 style="text-align:center;text-transform:uppercase;margin-top:0;color:#000;margin-bottom:10px;font-size:22px;">SÚMULA DE JOGO - ${esc(state.classCode)}</h4>
 <div style="text-align:center;font-size:13px;color:#64748b;margin-bottom:15px;">${esc(date)} — ${esc(time)}</div>

 <table style="width:100%;border-collapse:collapse;margin-bottom:20px;text-align:center;border:2px solid #000;">
 <thead>
 <tr>
 <th colspan="2" style="border:1px solid #000;padding:10px;background:#dc2626;color:#fff;text-align:center;vertical-align:middle;line-height:1.35;">
 <div style="font-size:18px;font-weight:900;">${esc(state.p1.name || 'A DEFINIR')}</div>
 ${state.p1.club ? `<div style="font-size:13px;font-weight:600;opacity:.95;">${esc(state.p1.club)}</div>` : ''}
 </th>
 <th style="border:1px solid #000;padding:10px;background:#0f172a;color:#fff;text-align:center;vertical-align:middle;font-size:14px;font-weight:800;">VERMELHO&nbsp;×&nbsp;AZUL</th>
 <th colspan="2" style="border:1px solid #000;padding:10px;background:#2563eb;color:#fff;text-align:center;vertical-align:middle;line-height:1.35;">
 <div style="font-size:18px;font-weight:900;">${esc(state.p2.name || 'A DEFINIR')}</div>
 ${state.p2.club ? `<div style="font-size:13px;font-weight:600;opacity:.95;">${esc(state.p2.club)}</div>` : ''}
 </th>
 </tr>
 <tr style="background:#f1f5f9;border-bottom:2px solid #000;">
 <th style="border:1px solid #000;padding:12px;width:20%;color:#dc2626;font-size:16px;text-align:center;">Tempo (V)</th>
 <th style="border:1px solid #000;padding:12px;width:15%;color:#dc2626;font-size:16px;text-align:center;">Pontos</th>
 <th style="border:1px solid #000;padding:12px;width:30%;font-size:16px;color:#000;text-align:center;">PARCIAL</th>
 <th style="border:1px solid #000;padding:12px;width:15%;color:#2563eb;font-size:16px;text-align:center;">Pontos</th>
 <th style="border:1px solid #000;padding:12px;width:20%;color:#2563eb;font-size:16px;text-align:center;">Tempo (A)</th>
 </tr>
 </thead>
 <tbody>${partialsRows}</tbody>
 <tfoot>
 <tr style="border-top:2px solid #000;background:#e2e8f0;">
 <td colspan="2" style="border:1px solid #000;padding:15px;font-size:32px;font-weight:bold;color:#dc2626;">${s1}</td>
 <td style="border:1px solid #000;padding:15px;font-weight:bold;font-size:20px;color:#000;">PLACAR FINAL</td>
 <td colspan="2" style="border:1px solid #000;padding:15px;font-size:32px;font-weight:bold;color:#2563eb;">${s2}</td>
 </tr>
 </tfoot>
 </table>

 <table style="width:100%;border-collapse:collapse;border:2px solid #000;">
 <tr>
 <td style="width:50%;border:1px solid #000;padding:15px;background:#fef2f2;vertical-align:top;">
 <div style="font-weight:bold;font-size:14px;margin-bottom:10px;color:#dc2626;border-bottom:2px solid #000;padding-bottom:6px;">VIOLAÇÕES (VERMELHO):</div>
 <div style="font-size:14px;color:#000;line-height:1.4;">${violsLines(state.p1.violations)}</div>
 </td>
 <td style="width:50%;border:1px solid #000;padding:15px;background:#eff6ff;vertical-align:top;">
 <div style="font-weight:bold;font-size:14px;margin-bottom:10px;color:#2563eb;border-bottom:2px solid #000;padding-bottom:6px;">VIOLAÇÕES (AZUL):</div>
 <div style="font-size:14px;color:#000;line-height:1.4;">${violsLines(state.p2.violations)}</div>
 </td>
 </tr>
 </table>
 ${winnerHtml}
 </div>`;
}

function showSumulaPreview() {
 if (!state) return;
 document.getElementById('sumula-content').innerHTML = buildSumulaHTML();
 document.getElementById('sumula-bg').style.display = 'block';
 document.getElementById('sumula-modal').style.display = 'flex';
}
function closeSumulaPreview() {
 document.getElementById('sumula-bg').style.display = 'none';
 document.getElementById('sumula-modal').style.display = 'none';
}
function printSumula() {
 document.getElementById('print-area').innerHTML = buildSumulaHTML();
 closeSumulaPreview();
 setTimeout(() => window.print(), 200);
}

// ── RESET ────────────────────────────────────────────────────────────
function resetGame() {
 if (!confirm('Zerar jogo completo e voltar à configuração?')) return;
 clearInterval(timerInterval); state = null; selectedClass = null;
 try { localStorage.removeItem('placar_bocha_state'); } catch(_) {}
 document.getElementById('game-screen').style.display = 'none';
 document.getElementById('setup-screen').style.display = 'flex';
 document.querySelectorAll('.class-btn').forEach(b => b.classList.remove('selected'));
 document.getElementById('custom-section').classList.remove('visible');
 ['p1-name','p1-club','p2-name','p2-club'].forEach(id => document.getElementById(id).value = '');
}

// ── FULLSCREEN ───────────────────────────────────────────────────────
function toggleFS() {
 if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(()=>{});
 else document.exitFullscreen().catch(()=>{});
}

// ── EVENT BINDINGS ───────────────────────────────────────────────────
document.getElementById('btn-menu').onclick = () => document.getElementById('sidebar').classList.add('open');
document.getElementById('btn-menu-close').onclick = () => document.getElementById('sidebar').classList.remove('open');
document.getElementById('btn-reset').onclick = resetGame;
document.getElementById('btn-sumula').onclick = () => { document.getElementById('sidebar').classList.remove('open'); showSumulaPreview(); };
document.getElementById('btn-fullscreen').onclick = () => { document.getElementById('sidebar').classList.remove('open'); toggleFS(); };
document.getElementById('btn-next-end').onclick = nextEnd;
document.getElementById('btn-play-p1').onclick = () => toggleTimer('p1');
document.getElementById('btn-play-p2').onclick = () => toggleTimer('p2');
document.getElementById('btn-viol-cancel').onclick = closeViolationModal;
document.getElementById('btn-viol-confirm').onclick = confirmViolation;
document.getElementById('modal-bg').onclick = closeViolationModal;
document.getElementById('btn-sumula-close').onclick = closeSumulaPreview;
document.getElementById('sumula-bg').onclick = closeSumulaPreview;
document.getElementById('btn-sumula-print').onclick = printSumula;

// Ball controls
document.querySelectorAll('.btn-ball-ctrl').forEach(btn => {
 btn.onclick = () => adjustBalls(btn.dataset.side, +btn.dataset.dir);
});

// Violation buttons
document.querySelectorAll('.btn-viol').forEach(btn => {
 btn.onclick = () => openViolationModal(btn.dataset.side);
});

// Score click to increment
document.getElementById('p1-end-score').onclick = () => adjustScore('p1', 1);
document.getElementById('p2-end-score').onclick = () => adjustScore('p2', 1);

// ── INIT ─────────────────────────────────────────────────────────────
(function init() {
 if (loadState() && state && state.p1.name) {
 document.getElementById('setup-screen').style.display = 'none';
 document.getElementById('game-screen').style.display = 'flex';
 document.getElementById('header-class').textContent = state.classCode || '—';
 renderAll();
 }
})();
</script>
</body>
</html>
